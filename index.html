<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>

<title>涨停时间轴复盘</title>
<style>
:root{--bg:#000;--panel:#111;--text:#fff;--muted:#bbb;--line:#333;--accent:#ffd54f;--link:#7dd3fc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 48px}
h1{margin:0 0 6px;font-size:22px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.list{display:flex;flex-direction:column;gap:10px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;transition:border-color .15s,background .15s}
a.card:hover{border-color:#666;background:#161616}
.date{font-size:16px;font-weight:700;color:var(--accent)}
.summary{margin-top:6px;color:#ddd;font-size:13px}
.meta{margin-top:8px;font-size:12px;color:var(--link)}
.empty{color:var(--muted);padding:24px 0}
footer{margin-top:28px;font-size:12px;color:#777}
</style>
</head>
<body>
